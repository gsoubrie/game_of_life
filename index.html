<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game of Life</title>

  <link rel="stylesheet" href="css/style.css" />

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="as-menu">

    <span class="title">Jeu de la vie</span>

    <div class="as-controls">

      <button id="btn-play"   class="as-button as-play">▶ Jouer</button>
      <button id="btn-step"   class="as-button">Pas à pas</button>
      <button id="btn-clear"  class="as-button">Vider</button>
      <button id="btn-random" class="as-button">Aléatoire</button>

      <div class="as-slider-container">
        <span>Vitesse</span>
        <input type="range" id="speed-slider" min="1" max="60" value="12" />
      </div>


      <div class="as-statistics">
        <span class="as-name">Génération</span>
        <span class="as-value" id="stat-gen">0</span>
      </div>

      <div class="as-statistics">
        <span class="as-name">Survivant</span>
        <span class="as-value" id="stat-alive">0</span>
      </div>

    </div>
  </div>

  <main class="as-viewport" id="viewport">

    <canvas id="grid-canvas"></canvas>

    <div class="as-zoom-container">
      ZOOM: <span id="zoom-label">100%</span>
    </div>

	<div class="as-legend">
	    <div class="as-desc">Zoom</div>
	    <div class="as-action">Molette</div>

	    <div class="as-desc">Déplacement</div>
	    <div class="as-action">Click droit + drag</div>

	    <div class="as-desc">Ajout de cellule</div>
	    <div class="as-action">Click gauche + drag</div>

	    <div class="as-desc">Suppression de cellule</div>
	    <div class="as-action">Click gauche + Shift</div>
	</div>

  </main>

  <script src="js/controller.js"></script>
  <script src="js/object/game.js"></script>
  <script src="js/object/grid.js"></script>
  <script src="js/object/view_port.js"></script>

</body>
</html>
